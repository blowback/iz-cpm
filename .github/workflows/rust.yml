name: Rust

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  videobeast:

    runs-on: ubuntu-latest

    env:
      SDL_VIDEODRIVER: dummy

    steps:
    - uses: actions/checkout@v4
    - name: Install SDL2 and a C++ compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev pkg-config g++
    - name: Build
      run: cargo build --verbose --features videobeast
    - name: Run tests
      run: cargo test --verbose --features videobeast
