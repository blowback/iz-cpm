[package]
name = "izcpm"
version = "1.3.2"
authors = ["Ivan Izaguirre <ivanizag@gmail.com>"]
edition = "2021"

[[bin]]
name = "iz-cpm"
path = "src/bin/main.rs"

[features]
# Attach beastem's VideoBeast (vendor/beastem, via shim/) to page 0x40.
# Needs a C++ compiler and SDL2 development files.
videobeast = ["dep:cc"]

[build-dependencies]
cc = { version = "1.8.0", optional = true }

[dependencies]
iz80 = "0.5.1"
#iz80 = {path = "../iz80"}
clap = "^2"

[target.'cfg(windows)'.dependencies]
crossterm = "^0.24"

[target.'cfg(unix)'.dependencies]
termios = "^0.3"
